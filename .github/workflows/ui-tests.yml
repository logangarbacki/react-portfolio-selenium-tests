name: Selenium UI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [run-selenium-tests]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-selenium-tests:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Selenium Tests Repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./SeleniumTestFramework.csproj

      - name: Build Selenium Project
        run: dotnet build --no-restore ./SeleniumTestFramework.csproj

      - name: Run Selenium Tests
        id: tests
        run: dotnet test ./SeleniumTestFramework.csproj --logger "console;verbosity=normal"
        continue-on-error: true

      # Pull trend history from the live report so the Allure graphs keep their history.
      - name: Fetch Allure history from the published report
        shell: pwsh
        run: |
          $dest = "bin\Debug\net8.0\allure-results\history"
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($f in 'history.json','history-trend.json','duration-trend.json','categories-trend.json','retry-trend.json') {
            try {
              Invoke-WebRequest -Uri "https://logangarbacki.github.io/react-portfolio-selenium-tests/history/$f" -OutFile "$dest\$f" -ErrorAction Stop
            } catch { Write-Host "No $f yet" }
          }
        continue-on-error: true

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Write Allure environment
        run: |
          echo "Browser=Chrome (Headless)" > bin\Debug\net8.0\allure-results\environment.properties
          echo "Environment=Production" >> bin\Debug\net8.0\allure-results\environment.properties
          echo "Base.URL=https://www.logangarbacki.dev" >> bin\Debug\net8.0\allure-results\environment.properties
          echo "Platform=Windows" >> bin\Debug\net8.0\allure-results\environment.properties

      - name: Generate Allure Report
        run: allure generate bin/Debug/net8.0/allure-results --clean -o allure-report

      # The status panel on logangarbacki.dev reads this file instead of calling the
      # GitHub API, which rate-limits unauthenticated requests to 60 an hour per IP.
      - name: Publish run details for the site
        shell: pwsh
        run: |
          [ordered]@{
            commit    = "${{ github.sha }}"
            branch    = "${{ github.ref_name }}"
            runNumber = ${{ github.run_number }}
            url       = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            outcome   = "${{ steps.tests.outcome }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM allure-report/ci-run.json

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      # Deploys straight to Pages from an artifact, so no commit lands on gh-pages.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4